name: Keep Render backend awake

# O plano gratuito do Render hiberna o serviço depois de ~15min sem
# tráfego, e a primeira requisição depois disso demora 30-50s pra
# "acordar" (cold start) — ruim justamente na hora em que alguém está
# avaliando o projeto pela primeira vez. Esse workflow bate no health
# check a cada 10min (margem segura abaixo dos ~15min de hibernação) só
# pra manter o serviço quente. Não é 100% garantido: o agendamento do
# GitHub Actions pode atrasar alguns minutos em horários de pico da
# plataforma, então um cold start ocasional ainda pode acontecer — mas
# a frequência cai drasticamente em relação a não ter nada rodando.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # Uma tentativa só com 55s de limite falhava sempre que o cold
      # start real passava um pouco disso (aconteceu na prática, ver
      # docs/ARCHITECTURE.md) — o Render às vezes leva mais que os
      # "30-50s" documentados, principalmente somando a latência de
      # rede do runner do GitHub até o Render. 3 tentativas com 60s
      # cada: a primeira já dispara o cold start mesmo se estourar o
      # tempo, as próximas pegam o serviço já acordando/acordado.
      - name: Pingar /api/health do backend (com retry pra cold start)
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 60 https://projeto-de-desenvolvimento-verzel.onrender.com/api/health; then
              exit 0
            fi
            echo "Tentativa $i falhou (provável cold start) — tentando de novo em 10s..."
            sleep 10
          done
          exit 1
